<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -32 702 648" role="img" aria-labelledby="title desc">
  <title id="title">wxsl — néon</title>
  <desc id="desc">Logo wxsl aux contours lumineux cyan, bleu électrique et magenta sur fond noir.</desc>
  <defs>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="80" y1="10" x2="260" y2="390">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset=".38" stop-color="#007FFF"/>
      <stop offset=".65" stop-color="#5730FF"/>
      <stop offset="1" stop-color="#FF20F5"/>
    </linearGradient>
    <linearGradient id="upper" gradientUnits="userSpaceOnUse" x1="410" y1="40" x2="510" y2="205">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset=".38" stop-color="#007FFF"/>
      <stop offset=".65" stop-color="#5730FF"/>
      <stop offset="1" stop-color="#FF20F5"/>
    </linearGradient>
    <linearGradient id="lower" gradientUnits="userSpaceOnUse" x1="390" y1="220" x2="500" y2="385">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset=".38" stop-color="#007FFF"/>
      <stop offset=".65" stop-color="#5730FF"/>
      <stop offset="1" stop-color="#FF20F5"/>
    </linearGradient>
    <linearGradient id="diamond" gradientUnits="userSpaceOnUse" x1="560" y1="25" x2="610" y2="190">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset=".38" stop-color="#007FFF"/>
      <stop offset=".65" stop-color="#5730FF"/>
      <stop offset="1" stop-color="#FF20F5"/>
    </linearGradient>
    <linearGradient id="letters" gradientUnits="userSpaceOnUse" x1="70" y1="450" x2="590" y2="575">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset=".38" stop-color="#007FFF"/>
      <stop offset=".65" stop-color="#5730FF"/>
      <stop offset="1" stop-color="#FF20F5"/>
    </linearGradient>
    <linearGradient id="inside" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="450" y2="580">
      <stop offset="0" stop-color="#002446"/>
      <stop offset=".35" stop-color="#020829"/>
      <stop offset=".7" stop-color="#100337"/>
      <stop offset="1" stop-color="#29003C"/>
    </linearGradient>
    <!-- The alpha silhouette unites overlapping letter strokes before outlining. -->
    <filter id="tube" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="erode" radius="2.6" result="inset"/>
      <feComposite in="SourceAlpha" in2="inset" operator="out" result="rim"/>
      <feComposite in="SourceGraphic" in2="rim" operator="in" result="color"/>
      <feGaussianBlur in="color" stdDeviation="9" result="wide"/>
      <feGaussianBlur in="color" stdDeviation="4" result="near"/>
      <feGaussianBlur in="color" stdDeviation="1.2" result="soft"/>
      <feColorMatrix in="color" type="matrix" values="0.4 0 0 0 0.6  0 0.4 0 0 0.6  0 0 0.4 0 0.6  0 0 0 1 0" result="hot"/>
      <feMerge>
        <feMergeNode in="wide"/><feMergeNode in="wide"/><feMergeNode in="wide"/>
        <feMergeNode in="near"/><feMergeNode in="near"/><feMergeNode in="near"/><feMergeNode in="near"/>
        <feMergeNode in="soft"/><feMergeNode in="soft"/><feMergeNode in="color"/><feMergeNode in="hot"/><feMergeNode in="hot"/>
      </feMerge>
    </filter>
    <filter id="line-glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mark-clip">
